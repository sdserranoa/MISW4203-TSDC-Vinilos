name: Release PR Auto Create

on:
  push:
    branches:
      - develop

jobs:
  test-and-espresso:
    name: Run Unit & Espresso Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Espresso Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          disable-animations: true
          script: ./gradlew connectedAndroidTest

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-develop
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload Espresso Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espresso-test-results-develop
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  create-release:
    name: Create Release Branch & PR
    needs: test-and-espresso
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if commit contains #RELEASE
        id: check_release
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)

          if echo "$COMMIT_MSG" | grep -q "#RELEASE"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Commit contiene #RELEASE"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Commit no contiene #RELEASE"
          fi

      - name: Create Release Branch
        if: steps.check_release.outputs.release == 'true'
        id: create_release
        run: |
          # Configurar identidades de Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION=$(date +%Y.%m.%d)
          BASE_BRANCH="release/${VERSION}"
          RELEASE_BRANCH="$BASE_BRANCH"
          COUNTER=1

          # Buscar un nombre disponible en origin
          while git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" > /dev/null 2>&1; do
            RELEASE_BRANCH="${BASE_BRANCH}-${COUNTER}"
            COUNTER=$((COUNTER + 1))
          done

          echo "Nombre de release disponible: ${RELEASE_BRANCH}"

          # Crear la rama desde develop y subirla
          git checkout -b "$RELEASE_BRANCH"
          git push origin "$RELEASE_BRANCH"

          # Exportar outputs
          echo "release_branch=${RELEASE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request to Main
        if: steps.check_release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_BRANCH="${{ steps.create_release.outputs.release_branch }}"
          VERSION="${{ steps.create_release.outputs.version }}"

          EXISTING_PR=$(gh pr list \
            --head "$RELEASE_BRANCH" \
            --base main \
            --json number \
            --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "Release v${VERSION} - ${RELEASE_BRANCH} → main" \
              --body "## Release v${VERSION}

              Pull Request de release desde \`${RELEASE_BRANCH}\` hacia \`main\`.

              ## Calidad y Pruebas
              - Pruebas unitarias ejecutadas y aprobadas en \`develop\`
              - Pruebas instrumentadas (Espresso) ejecutadas y aprobadas en emulador

              ---
              *PR creado automáticamente por GitHub Actions*
              *Trigger: Commit con #RELEASE en develop y pruebas aprobadas*"

            echo "Release Pull Request creado exitosamente"
          else
            echo "Ya existe un Release Pull Request (#$EXISTING_PR)"
          fi
