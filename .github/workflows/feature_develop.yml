name: Feature PR Auto Create

on:
  push:
    branches:
      - 'feature/**'

jobs:
  test-and-lint:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-feature
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-feature
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
          if-no-files-found: ignore

  create-pull-request:
    name: Create Pull Request
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if commit contains #DONE
        id: check_done
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -q "#DONE"; then
            echo "done=true" >> $GITHUB_OUTPUT
            echo "Commit contiene #DONE, se creará el PR"
          else
            echo "done=false" >> $GITHUB_OUTPUT
            echo "Commit no contiene #DONE, se omite la creación del PR"
          fi

      - name: Create Pull Request
        if: steps.check_done.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          PR_TITLE="feat: ${BRANCH_NAME}"
          PR_BODY="## Descripción
          Pull Request automático desde la rama \`${BRANCH_NAME}\`
          
          ## Calidad y Pruebas
          - Pruebas unitarias ejecutadas y aprobadas exitosamente
          - Análisis estático (Lint) verificado sin errores
          
          ## Cambios
          - Se implementaron los cambios de la historia de usuario
          
          ---
          *Este PR fue creado automáticamente por GitHub Actions*
          *Trigger: Commit con #DONE*"
          # test 2
          # Verificar si ya existe un PR para esta rama
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base develop --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base develop \
              --head "$BRANCH_NAME" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
            echo "Pull Request creado exitosamente"
          else
            echo "Ya existe un Pull Request (#$EXISTING_PR) para esta rama"
          fi
